<!doctype html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'bookManager/modifyBook.css'%}" />
  </head>
  <body>
    <div class="log">
      <p>Logged In as: {{ user.username }}</p>
      <form action="{% url 'logoutuser' %}" method="post">
        {% csrf_token %}
        <button type="submit" class="boton">Logout</button>
      </form>
    </div>
    <div class="modify">
      <h1>Modify Book</h1>
      <form method="POST">
        {% csrf_token %}{{ form.as_p}}
        <button type="submit" class="boton">Save</button>
        <a href="{% url 'book-detail-page' book.id %}" class="boton">Cancel</a>
      </form>
    </div>
  </body>
</html>
